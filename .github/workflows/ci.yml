name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install httpx==0.28.1 pyyaml==6.0.3 pytest-cov==7.1.0
      - name: Run test suite with coverage (C24)
        working-directory: ${{ github.workspace }}
        run: |
          python -m pytest toolkit/tests/ -q \
            --cov=toolkit --cov-report=term-missing --cov-fail-under=70

  lint:
    name: lint (compile + pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install httpx==0.28.1 pyyaml==6.0.3
      - name: Syntax check all modules
        run: python -m compileall -q toolkit orchestrator.py watch_daemon.py scripts
      - name: Install pyflakes
        run: pip install pyflakes==3.3.2
      - name: Run pyflakes
        run: python -m pyflakes toolkit orchestrator.py watch_daemon.py
